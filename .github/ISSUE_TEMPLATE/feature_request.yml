name: Feature request
description: Propose an observable improvement, not just a code change
title: 'feat: '
body:
  - type: textarea
    id: problem
    attributes: {label: User problem and value}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes: {label: Scope and non-goals}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance criteria and beta test plan}
    validations: {required: true}

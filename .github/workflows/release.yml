name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Validate runtime
        run: bun run check
      - name: Test
        run: bun test/run.mjs
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release archive
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          ROOT="omp-top-$VERSION"
          ARCHIVE="omp-top-$TAG.tar.gz"
          mkdir -p "dist/$ROOT"
          cp -R src package.json README.md LICENSE install.sh uninstall.sh "dist/$ROOT/"
          tar -C dist -czf "dist/$ARCHIVE" "$ROOT"
          (cd dist && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")
      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          ARCHIVE="omp-top-$TAG.tar.gz"
          gh release create "$TAG" "dist/$ARCHIVE" "dist/$ARCHIVE.sha256" --target "$GITHUB_SHA" --title "omp-top $TAG" --generate-notes

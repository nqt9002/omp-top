name: Release Stable
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'install.sh'
      - 'uninstall.sh'
      - 'scripts/release.mjs'
      - '.github/workflows/release-stable.yml'
      - '.github/workflows/release-checked.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional exact recovery tag; stable normally resolves to v<release-line>'
        required: false
        type: string
      expected_sha:
        description: 'Optional pinned main SHA; defaults to the selected workflow ref SHA'
        required: false
        type: string
      tested_beta:
        description: 'Optional tested beta override; normally latest published beta of the same release line is selected'
        required: false
        type: string
      hotfix_issue:
        description: 'Emergency exception: tracking issue number, next patch only; mutually exclusive with tested beta'
        required: false
        type: string
      notes:
        description: 'Optional promotion evidence; an automatic note is used for merge-triggered stable releases'
        required: false
        type: string
      confirm:
        description: 'Required only for manual recovery publication'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/release-checked.yml
    with:
      channel: stable
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
      expected_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
      notes: ${{ github.event_name == 'workflow_dispatch' && inputs.notes || 'Automatic stable publication after an accepted merge to main; promotion still requires a tested beta of the same runtime and release line.' }}
      tested_beta: ${{ github.event_name == 'workflow_dispatch' && inputs.tested_beta || '' }}
      hotfix_issue: ${{ github.event_name == 'workflow_dispatch' && inputs.hotfix_issue || '' }}
      confirmed: ${{ github.event_name == 'push' || inputs.confirm }}
